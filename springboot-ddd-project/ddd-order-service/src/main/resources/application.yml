# ==============================================================================
# ddd-order-service 主配置
# ==============================================================================
server:
  port: 8085

spring:
  application:
    name: ddd-order-service
  datasource:
    url: jdbc:mysql://localhost:3306/ddd_order?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379
      database: 4
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

rocketmq:
  name-server: localhost:9876
  producer:
    group: ddd-order-producer

ddd:
  messaging:
    enabled: true
  web:
    errors: true
  services:
    auth-url: http://localhost:8081
    user-url: http://localhost:8082
    product-url: http://localhost:8083
    inventory-url: http://localhost:8084
    payment-url: http://localhost:8086
    logistics-url: http://localhost:8087
    cart-url: http://localhost:8088
  order:
    # 订单支付超时时间（分钟），超时后由定时任务自动关单
    payment-timeout-minutes: 30
    # 定时关单任务的执行间隔（毫秒）
    timeout-scan-interval-ms: 60000

logging:
  level:
    root: INFO
    com.example.ddd: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
