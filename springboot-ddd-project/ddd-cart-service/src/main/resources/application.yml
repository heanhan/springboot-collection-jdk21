# ==============================================================================
# ddd-cart-service 主配置
# ==============================================================================
server:
  port: 8088

spring:
  application:
    name: ddd-cart-service
  datasource:
    url: jdbc:mysql://localhost:3306/ddd_cart?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379
      database: 7
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

rocketmq:
  name-server: localhost:9876
  producer:
    group: ddd-cart-producer

ddd:
  web:
    errors: true
  services:
    auth-url: http://localhost:8081
    product-url: http://localhost:8083
    inventory-url: http://localhost:8084
  cart:
    # 单用户购物车最大条目数
    max-items-per-user: 100

logging:
  level:
    root: INFO
    com.example.ddd: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
