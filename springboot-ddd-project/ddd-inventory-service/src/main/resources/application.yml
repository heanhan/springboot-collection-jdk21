# ==============================================================================
# ddd-inventory-service 主配置
# ==============================================================================
server:
  port: 8084

spring:
  application:
    name: ddd-inventory-service
  datasource:
    url: jdbc:mysql://localhost:3306/ddd_inventory?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 库存服务写密集，连接池适度放大
      maximum-pool-size: 40
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379
      database: 3
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

rocketmq:
  name-server: localhost:9876
  producer:
    group: ddd-inventory-producer

ddd:
  services:
    auth-url: http://localhost:8081
    product-url: http://localhost:8083
  inventory:
    # 库存预占乐观锁最大重试次数
    lock-max-retry: 3

logging:
  level:
    root: INFO
    com.example.ddd: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
