# ==============================================================================
# ddd-payment-service 主配置
# ==============================================================================
server:
  port: 8086

spring:
  application:
    name: ddd-payment-service
  datasource:
    url: jdbc:mysql://localhost:3306/ddd_payment?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379
      database: 5
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

rocketmq:
  name-server: localhost:9876
  producer:
    group: ddd-payment-producer

ddd:
  messaging:
    enabled: true
  web:
    errors: true
  services:
    auth-url: http://localhost:8081
    order-url: http://localhost:8085
  payment:
    mock-enabled: ${PAYMENT_MOCK_ENABLED:false}
    # Mock 渠道：模拟支付回调延迟（秒），便于观察流程
    mock-callback-delay-seconds: 3
    # 支持的渠道列表
    supported-channels: ALIPAY,WECHAT,MOCK

logging:
  level:
    root: INFO
    com.example.ddd: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
