# ==============================================================================
# ddd-auth-service 主配置
# ==============================================================================
server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: ddd-auth-service

  # 数据源：独立 Schema ddd_auth
  datasource:
    url: jdbc:mysql://localhost:3306/ddd_auth?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000

  # JPA 配置
  jpa:
    hibernate:
      # 由 Flyway 管理表结构，Hibernate 只做校验
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # Flyway 数据库迁移
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2

  # Jackson
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# ==============================================================================
# RocketMQ
# ==============================================================================
rocketmq:
  name-server: localhost:9876
  producer:
    group: ddd-auth-producer
    send-message-timeout: 3000
    retry-times-when-send-failed: 2

# ==============================================================================
# OpenFeign：由于本项目未接入注册中心，采用静态 URL 直连
# ==============================================================================
spring.cloud.openfeign:
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 5000
        logger-level: basic

# 各 Feign Client 的 URL 通过 ddd.services.* 自定义配置注入，
# 具体在 infrastructure/rpc/FeignClientConfig 中处理。
ddd:
  services:
    user-url: http://localhost:8082
    product-url: http://localhost:8083
    inventory-url: http://localhost:8084
    order-url: http://localhost:8085
    payment-url: http://localhost:8086
    logistics-url: http://localhost:8087
    cart-url: http://localhost:8088

  # ==============================================================================
  # JWT 配置
  # ==============================================================================
  jwt:
    # HS256 对称密钥；生产环境使用 RS256 非对称，密钥存 KMS
    secret: "ddd-learning-project-jwt-secret-key-please-change-in-production-32bytes-min"
    # AccessToken 有效期 (秒)：30 分钟
    access-token-ttl: 1800
    # RefreshToken 有效期 (秒)：7 天
    refresh-token-ttl: 604800
    issuer: "ddd-auth-service"

  # ==============================================================================
  # 登录安全策略
  # ==============================================================================
  login:
    max-fail-count: 5      # 最大失败次数
    lock-minutes: 10        # 锁定时长 (分钟)

# ==============================================================================
# 日志
# ==============================================================================
logging:
  level:
    root: INFO
    com.example.ddd: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# ==============================================================================
# 接口文档
# ==============================================================================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ==============================================================================
# Actuator
# ==============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
