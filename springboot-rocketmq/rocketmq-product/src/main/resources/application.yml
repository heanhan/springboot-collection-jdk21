# ===================================================================
# rocketmq-product（生产者服务）配置
# 说明：本模块只负责生产端场景 —— 8 种发送方式、事务回查、本地消息表落库与重试。
#      对应的消费者示例请启动 rocketmq-consume 模块。
# ===================================================================
server:
  # 生产者服务端口（与 rocketmq-consume 的 11002 区分）
  port: 11001
  servlet:
    # 统一上下文路径，所有接口以 /rocketmq-demo 开头
    context-path: /rocketmq-demo

spring:
  application:
    name: rocketmq-product

  # ================== 数据源（三张表：生产 mq_produce_record / 消费 mq_consume_record / 重试 mq_message_retry） ==================
  # 生产者模块主要读写 mq_produce_record 与 mq_message_retry；
  # mq_consume_record 由 MessageRetryService 在「消费重放成功/死信」时回写，因此仍需连接。
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://172.16.75.105:3306/springboot-rocketmq?characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: abcd@123456

  # ================== JPA / Hibernate ==================
  jpa:
    hibernate:
      # 首次启动自动建表；生产环境建议改为 validate 并用 DDL 脚本管理
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# ================== 可靠消息（本地消息表）自定义配置 ==================
reliability:
  # 单条消息最大重试次数，达到后置为死信（DEAD），不再自动重试
  max-retry: 3
  # 重试基础间隔（秒），采用递增退避：第 n 次重试延迟 = base-retry-interval * n
  base-retry-interval-seconds: 10
  # 失败消息扫描调度间隔（毫秒），定时从统一重试表 mq_message_retry 捞出到期消息重试
  retry-scan-interval-millis: 10000
  # 每次扫描最多处理条数，避免单次任务过重
  retry-batch-size: 50
  # ---------- 异步落库线程池（JUC） ----------
  async:
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 2000
    keep-alive-seconds: 60

# ========================= RocketMQ 核心配置 =========================
rocketmq:
  # NameServer 地址；集群部署时多个地址用英文分号(;)分隔
  name-server: 172.16.75.106:9876
  producer:
    # 【必填】生产者组名；事务消息也复用该生产者组
    group: demo-producer-group
    # 同步发送超时时间（毫秒）
    send-message-timeout: 3000
    # 同步发送失败后的重试次数
    retry-times-when-send-failed: 2
    # 异步发送失败后的重试次数
    retry-times-when-send-async-failed: 2
    # 单次异步发送重试的间隔（毫秒）
    retry-next-delay-time-millis: 1000
    # 单条消息最大长度：4MB
    max-message-size: 4194304

# ============================ 日志配置 ============================
logging:
  level:
    org.apache.rocketmq: INFO
    org.example.rocketmq: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
