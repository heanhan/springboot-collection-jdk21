server:
  port: 8200
  servlet:
    context-path: /dynamic/jpa

spring:
  application:
    name: dynamic-datasource-jpa
  config:
    import: optional:file:./config/application-local.yml
  profiles:
    active: dev
  jpa:
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/system
    table: flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    out-of-order: false

security:
  jwt:
    secret: ""

app:
  token:
    store: redis
    access-ttl-minutes: 30
    refresh-ttl-days: 7
    refresh-cookie-secure: false
    refresh-cookie-same-site: Lax
  datasource:
    startup:
      eager-register: true
      fail-fast: false
    tenant-pool:
      initial-size: 0
      min-idle: 0
      max-active: 8
      max-wait: 10000
      connect-timeout-millis: 3000
      socket-timeout-millis: 10000
      idle-evict-millis: 1800000
      max-total-connections: 200
    crypto:
      enabled: false
      public-key: ""
      private-key: ""
    provisioner:
      host: 172.16.75.105
      port: 3306
      username: ""
      password: ""
      create-user: true
    cluster-sync:
      enabled: false
      channel: dynjpa:datasource:changes

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
