spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://172.16.75.105:3306/springboot-jpa?characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://172.16.75.105:3306/springboot-jpa?characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      filter:
        config:
          enabled: false
        stat:
          enabled: true
      filters: stat,wall,slf4j
      initial-size: 2
      min-idle: 2
      max-active: 20
      max-wait: 10000
      min-evictable-idle-time-millis: 300000
      time-between-eviction-runs-millis: 60000
      validation-query: SELECT 1
      validation-query-timeout: 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: false
      max-pool-prepared-statement-per-connection-size: -1
      stat-view-servlet:
        enabled: false
        allow: 127.0.0.1
        reset-enable: false
      web-stat-filter:
        enabled: false
  data:
    redis:
      host: 172.16.75.105
      port: 6379
      database: 1
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-wait: 3000ms
          max-idle: 8
          min-idle: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: info
    com.example.dynamic.jpa: debug
    sql: warn
