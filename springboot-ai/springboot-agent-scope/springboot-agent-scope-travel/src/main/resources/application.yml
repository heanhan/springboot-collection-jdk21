spring:
  application:
    name: springboot-agent-scope-travel
  datasource:
    url: jdbc:mysql://172.16.75.105:3306/travel_rag?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: "root"
    password: "abcd@123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

travel:
  context:
    time-zone: Asia/Shanghai
  agent:
    api-key: "qwertyuiop"
    base-url: "http://127.0.0.1:8000/v1"
    model-name: "Qwen3.6-35B-A3B-5bit"
    stream: true
    temperature: 0.2
    max-tokens: 2048
    timeout-seconds: 180
    state-directory: .agentscope-data/travel
    memory-workspace-directory: .agentscope-data/travel-memory

  rag:
    knowledge-pattern: classpath*:knowledge/travel/*.md
    top-k: 3
    embedding:
      base-url: "http://127.0.0.1:8000/v1"
      api-key: "qwertyuiop"
      model-name: "Qwen3-Embedding-0.6B"
      dimension: 1024
      timeout-seconds: 60
      query-instruction: "Instruct: Given a web search query, retrieve relevant passages that answer the query"
    vector:
      url: "jdbc:postgresql://172.16.75.106:5432/postgres"
      username: "postgres"
      password: "postgres"
      min-similarity: 0.45
      candidate-limit: 20
