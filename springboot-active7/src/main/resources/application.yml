server:
  port: 8890
  servlet:
    context-path: /active

spring:
  application:
    name: springboot-active7
  profiles:
    active: mysql

  mybatis-plus:
    configuration:
      map-underscore-to-camel-case: true
    mapper-locations: classpath:mapper/*.xml

  activiti:
    db-history-used: true
    history-level: full
    database-schema-update: true
    check-process-definitions: true
    # 教学阶段关闭异步执行器，便于单步调试；生产环境再开启。
    async-executor-activate: false

  thymeleaf:
    cache: false

management:
  endpoint:
    health:
      show-details: never

active7:
  security:
    jwt:
      issuer: active7-learning
      access-token-seconds: 900
      refresh-token-seconds: 604800
      refresh-cookie-name: active7_refresh
      refresh-cookie-path: /active/api/auth
      refresh-cookie-secure: false

logging:
  level:
    root: INFO
    com.example.active7: DEBUG
    org.activiti.engine.impl.persistence.entity: DEBUG
